<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <rect width="1600" height="1200" fill="#ffffff"/>
  <style>
    .text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #173c2c; }
    .title { font-size: 54px; font-weight: 700; }
    .subtitle { font-size: 23px; fill: #536d5f; }
    .head { font-size: 20px; font-weight: 700; }
    .name { font-size: 22px; font-weight: 700; }
    .body { font-size: 17px; fill: #294a3a; }
    .small { font-size: 15px; fill: #294a3a; }
    .rank { font-size: 25px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .trend-label { font-size: 27px; font-weight: 700; }
    .trend { font-size: 18px; fill: #294a3a; }
  </style>

  <rect x="28" y="24" width="1544" height="122" rx="27" fill="#eef6e9" stroke="#acd3a6" stroke-width="1.5"/>
  <text class="text title" x="66" y="83">Benchmark 精选周刊 · 第7期</text>
  <text class="text subtitle" x="66" y="124">2026/09/21–09/27  ｜  Agent · Robotics · World Model · Dataset · Audio</text>

  <rect x="28" y="166" width="1544" height="50" rx="15" fill="#dcefd4"/>
  <text class="text head" x="48" y="198">排名</text>
  <text class="text head" x="122" y="198">Benchmark / Dataset</text>
  <text class="text head" x="415" y="198">方向</text>
  <text class="text head" x="600" y="198">简要介绍</text>
  <text class="text head" x="1190" y="198">发布时间</text>
  <text class="text head" x="1320" y="198">发布机构</text>

  <!-- 1 -->
  <rect x="28" y="230" width="1544" height="84" rx="17" fill="#eff8eb" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="246" width="52" height="52" rx="10" fill="#2f855a"/>
  <text class="text rank" x="74" y="281">1</text>
  <text class="text name" x="122" y="280">EmbodiedSWE-Bench</text>
  <text class="text body" x="415" y="263"><tspan x="415">Coding Agent /</tspan><tspan x="415" dy="23">机器人</tspan></text>
  <text class="text body" x="600" y="260"><tspan x="600">6 个套件、28 个任务、17 种具身形态；将验证通过的</tspan><tspan x="600" dy="23">解决方案扩展为 VLA 训练数据。</tspan></text>
  <text class="text body" x="1190" y="280">2026/09/23</text>
  <text class="text small" x="1320" y="258"><tspan x="1320">ByteDance Seed、Yale、</tspan><tspan x="1320" dy="21">Princeton 等</tspan></text>

  <!-- 2 -->
  <rect x="28" y="322" width="1544" height="84" rx="17" fill="#eff8eb" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="338" width="52" height="52" rx="10" fill="#2f855a"/>
  <text class="text rank" x="74" y="373">2</text>
  <text class="text name" x="122" y="372">RRSI</text>
  <text class="text body" x="415" y="372">Agent Harness</text>
  <text class="text body" x="600" y="352"><tspan x="600">在 8 个 Benchmark 上研究评测过拟合；OOD 最高提升</tspan><tspan x="600" dy="23">4.7 分，策略 token 减少约 30%。</tspan></text>
  <text class="text body" x="1190" y="372">2026/09/21</text>
  <text class="text small" x="1320" y="352"><tspan x="1320">Google Cloud AI</tspan><tspan x="1320" dy="21">Research 等</tspan></text>

  <!-- 3 -->
  <rect x="28" y="414" width="1544" height="84" rx="17" fill="#eff8eb" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="430" width="52" height="52" rx="10" fill="#2f855a"/>
  <text class="text rank" x="74" y="465">3</text>
  <text class="text name" x="122" y="464">Era by Eon</text>
  <text class="text body" x="415" y="464">企业 Agent</text>
  <text class="text body" x="600" y="444"><tspan x="600">跨 CRM、通话记录等系统恢复隐藏知识，推断任何单条</tspan><tspan x="600" dy="23">记录都没有直接写明的信息。</tspan></text>
  <text class="text body" x="1190" y="464">2026/09/24</text>
  <text class="text body" x="1320" y="464">Eon</text>

  <!-- 4 -->
  <rect x="28" y="506" width="1544" height="84" rx="17" fill="#ffffff" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="522" width="52" height="52" rx="10" fill="#63a37b"/>
  <text class="text rank" x="74" y="557">4</text>
  <text class="text name" x="122" y="556">TriWorldBench</text>
  <text class="text body" x="415" y="546"><tspan x="415">多视角</tspan><tspan x="415" dy="23">世界模型</tspan></text>
  <text class="text body" x="600" y="536"><tspan x="600">500 个同步 episode、50 个双臂任务、19 项指标，检验</tspan><tspan x="600" dy="23">头部与双腕三路视频是否属于同一个物理世界。</tspan></text>
  <text class="text body" x="1190" y="556">2026/09/22</text>
  <text class="text small" x="1320" y="534"><tspan x="1320">Peking University、</tspan><tspan x="1320" dy="21">Tsinghua University 等</tspan></text>

  <!-- 5 -->
  <rect x="28" y="598" width="1544" height="84" rx="17" fill="#ffffff" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="614" width="52" height="52" rx="10" fill="#63a37b"/>
  <text class="text rank" x="74" y="649">5</text>
  <text class="text name" x="122" y="648">MolDesignBench</text>
  <text class="text body" x="415" y="638"><tspan x="415">分子设计</tspan><tspan x="415" dy="23">Agent</tspan></text>
  <text class="text body" x="600" y="628"><tspan x="600">2,000 个分子生成与优化任务、17 个化学工具；</tspan><tspan x="600" dy="23">最佳 Agent 成功率仅约 43%。</tspan></text>
  <text class="text body" x="1190" y="648">2026/09/23</text>
  <text class="text small" x="1320" y="626"><tspan x="1320">Korea University、</tspan><tspan x="1320" dy="21">LG AI Research</tspan></text>

  <!-- 6 -->
  <rect x="28" y="690" width="1544" height="84" rx="17" fill="#ffffff" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="706" width="52" height="52" rx="10" fill="#63a37b"/>
  <text class="text rank" x="74" y="741">6</text>
  <text class="text name" x="122" y="740">MVCAP-Bench</text>
  <text class="text body" x="415" y="730"><tspan x="415">GUI Agent /</tspan><tspan x="415" dy="23">动态视觉</tspan></text>
  <text class="text body" x="600" y="720"><tspan x="600">600 个动态 CAPTCHA；人类成功率 99.6%，最佳 GUI</tspan><tspan x="600" dy="23">Agent 仅 16.8%，揭示明显的时间视觉感知差距。</tspan></text>
  <text class="text body" x="1190" y="740">2026/09/23</text>
  <text class="text small" x="1320" y="714"><tspan x="1320">Shanghai Jiao Tong</tspan><tspan x="1320" dy="20">University、Shanghai</tspan><tspan x="1320" dy="20">AI Laboratory</tspan></text>

  <!-- 7 -->
  <rect x="28" y="782" width="1544" height="84" rx="17" fill="#ffffff" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="798" width="52" height="52" rx="10" fill="#63a37b"/>
  <text class="text rank" x="74" y="833">7</text>
  <text class="text name" x="122" y="832">Ajar</text>
  <text class="text body" x="415" y="822"><tspan x="415">Agent 安全 /</tspan><tspan x="415" dy="23">权限</tspan></text>
  <text class="text body" x="600" y="812"><tspan x="600">在攻击成功率与正常任务效用之外增加“开放权限”，</tspan><tspan x="600" dy="23">衡量任务不需要却仍被防御系统放行的危险权限。</tspan></text>
  <text class="text body" x="1190" y="832">2026/09/22</text>
  <text class="text small" x="1320" y="806"><tspan x="1320">University of Washington、</tspan><tspan x="1320" dy="20">Ohio State、Microsoft</tspan><tspan x="1320" dy="20">Research</tspan></text>

  <!-- 8 -->
  <rect x="28" y="874" width="1544" height="84" rx="17" fill="#ffffff" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="890" width="52" height="52" rx="10" fill="#63a37b"/>
  <text class="text rank" x="74" y="925">8</text>
  <text class="text name" x="122" y="924">RGBD20K</text>
  <text class="text body" x="415" y="914"><tspan x="415">RGB-D</tspan><tspan x="415" dy="23">语义分割</tspan></text>
  <text class="text body" x="600" y="904"><tspan x="600">20,000 对 RGB-D 图像、160 个细粒度类别；重新检查</tspan><tspan x="600" dy="23">并修正历史标签噪声，提供高质量 Ground Truth。</tspan></text>
  <text class="text body" x="1190" y="924">2026/09/24</text>
  <text class="text small" x="1320" y="914"><tspan x="1320">University of</tspan><tspan x="1320" dy="21">North Texas</tspan></text>

  <!-- 9 -->
  <rect x="28" y="966" width="1544" height="84" rx="17" fill="#ffffff" stroke="#acd3a6" stroke-width="1.4"/>
  <rect x="48" y="982" width="52" height="52" rx="10" fill="#63a37b"/>
  <text class="text rank" x="74" y="1017">9</text>
  <text class="text name" x="122" y="1016">COSED</text>
  <text class="text body" x="415" y="1006"><tspan x="415">开放词汇</tspan><tspan x="415" dy="23">声音事件检测</tspan></text>
  <text class="text body" x="600" y="996"><tspan x="600">统一评测 6 个时序标注任务；COSED 在 5 项领先，</tspan><tspan x="600" dy="23">第 6 项与最佳方法持平，覆盖固定词表与自由文本查询。</tspan></text>
  <text class="text body" x="1190" y="1016">2026/09/24</text>
  <text class="text small" x="1320" y="996"><tspan x="1320">Meta Reality Labs</tspan><tspan x="1320" dy="21">Research</tspan></text>

  <rect x="28" y="1066" width="1544" height="106" rx="20" fill="#eef6e9" stroke="#acd3a6" stroke-width="1.4"/>
  <text class="text trend-label" x="66" y="1110">本周趋势</text>
  <text class="text trend" x="224" y="1102"><tspan x="224">Agent 正从 Benchmark 的解题者进一步变成训练环境与监督数据的生成器；评测也从最终 Pass Rate，</tspan><tspan x="224" dy="25">扩展到隐藏知识、跨视角一致性、权限暴露、时间视觉感知和结构化失败模式。</tspan></text>
  <text class="text small" x="1450" y="1152" text-anchor="end">来源：心豆茶</text>
</svg>
